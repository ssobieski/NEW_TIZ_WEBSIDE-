[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agents"
version = "0.2.0"
description = "Agentic lokalny monitoring rynku (vLLM/A100 + inteligentny parsing)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.0",
  "trafilatura>=1.12.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.1",
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dateutil>=2.9.0",
  "schedule>=1.2.2",
  "tenacity>=8.3.0",
]

[project.scripts]
market-agents = "market_agents.cli:app"

[tool.setuptools.packages.find]
include = ["market_agents*"]

[tool.pytest.ini_options]
pythonpath = ["."]
