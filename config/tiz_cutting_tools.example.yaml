  focus_questions:
  - Jakie NOWE firmy / marki narzędzi skrawających pojawiają się poza listą known_firms?
  - Która firma jest dystrybutorem / dealerem innej (siatka powiązań distributor_of / dealer_of)?
  - Jakie marki własne (brand_of) i grupy OEM (oem_group / subsidiary_of) widać u konkurencji?
  - Jakie nowe e-katalogi / PDF / digital catalogues wypuszczają znane firmy z indeksu?
  - Jakie DOSTĘPNE źródła TECHNICZNE o produktach (cutting data / handbook / ISO 13399 / application guide) mają znane firmy — i jaki jest układ pól vc/fz/ap (bez kopiowania tabel do CutData)?
  - Jakie DOSTĘPNE CENNIKI (price list / Preisliste / cennik PDF) publikują znane firmy — publiczne vs za loginem?
  - Co zmienia się w e-shopach (asortyment, ceny, selektory)?
  - Jakie publikacje / handbooki / application guides są nowe?
  - Które firmy z listy znanych firm mają nowe Downloads / Site URL?
  - Jak wyglądają kalkulatory / selektory online vs TIZ?
  - Jakie standardy danych (ISO 13399 / DIN 4000 / GTC) są w ruchu?
  - Którzy wystawcy pojawiają się na targach (EMO / AMB / IMTS) poza known_firms?
  - Co piszą czasopisma i portale branżowe o nowych markach / katalogach / przejęciach?
  - Co firmy komunikują w mediach społecznościowych (YouTube/LinkedIn/X) o nowych produktach, katalogach, targach?
  - "Jakie książki / artykuły naukowe / wideo (literatura: dynamika obróbki, narzędzia) warto dodać do korpusu Pozycje?"
  - "Jaki jest kontekst technologiczny (materiały ISO P/M/K/N/S/H, maszyny, chłodziwo, procesy) w nowych handbookach / katalogach?"
