  notion:
    enabled: true
    token_env: NOTION_TOKEN
    root_pages:
    - 3c2bdd41-cccd-8176-bf12-f6efd37baacc
    - 3c2bdd41-cccd-81dc-8c62-e9aa3ff740aa
    - 3c2bdd41-cccd-816f-8171-c28e1128cf1c
    - 3c2bdd41-cccd-8152-9e94-d21ca8f3e95b
    - 308dfae4-647b-40e7-84a3-0b3f8406c769
    - 3c1bdd41-cccd-8113-abfc-e4de309c512f
    search_queries:
    - katalogi konkurencji
    - ecatalog PDF eshop
    - znane firmy indeks
    - ISO 13399
    - handbook machining
    - literatura dynamika obróbki
    - książki artykuły wideo narzędzia
    max_pages: 100
    include_child_pages: true
    # Notion = źródło prawdy: jakie firmy istnieją + ich przedstawienie
    enrich_firm_presentations: true
    presentation_max_chars: 4000
    known_firms_database: 308dfae4-647b-40e7-84a3-0b3f8406c769
    # Baza Pozycje (Type=book|paper|video|code) — paper→article
    literature_database: 948d6c02-d3bb-4b30-8c0c-a26f873bf719
    # Parent page for optional CRM task push (crm push-notion)
    # crm_parent_page: <notion-page-id-or-url>
  cloudflare_r2:
    enabled: false
    account_id_env: CF_ACCOUNT_ID
    access_key_env: CF_R2_ACCESS_KEY_ID
    secret_key_env: CF_R2_SECRET_ACCESS_KEY
    bucket: tiz-market-intel
    prefix: monitoring/
    max_objects: 200
    text_extensions:
    - .json
    - .jsonl
    - .md
    - .txt
    - .html
    - .csv
    - .xml
    - .pdf
  firm_discovery:
    enabled: true
    language: en
    region: US
    max_items: 20
    search_queries:
    - '"cutting tools" (startup OR "new manufacturer" OR "new brand" OR debut OR "spin-off")'
    - '"carbide tools" ("enters the market" OR "new company" OR exhibitor OR "first catalog")'
    - '"tooling manufacturer" (launch OR unveils OR introduces) (catalog OR ecatalog)'
    - '"narzędzia skrawające" (nowy producent OR debiut OR "nowa marka")'
    - '"solid carbide" ("new brand" OR startup OR "new player")'
    feed_urls: []
    known_match_threshold: 0.88
llm:
  provider: vllm
  base_url: http://127.0.0.1:8000
  model: Qwen/Qwen2.5-72B-Instruct-AWQ
  temperature: 0.1
  timeout_seconds: 300
  api_key: EMPTY
  max_tokens: 4096
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.9
  max_model_len: 32768
agents:
  max_items_per_source: 20
  lookback_hours: 168
  report_dir: reports
  data_dir: data
  min_relevance_score: 0.25
  agentic:
    enabled: true
    max_steps: 14
    max_deep_parses: 10
    parallel_fetches: 2
    require_tool_use: true
    trace_dir: data/agent_traces
    learn_parse_rules: true
    parse_rules_path: data/knowledge/site_parse_rules.json
    learn_parsing_skills: true
    parsing_skills_path: data/knowledge/parsing_skills.json
    # safer default: nie auto-promuj reguł z VPS bez przeglądu
    auto_promote_host_skills: false
  crawl:
    enabled: true
    min_delay_seconds: 1.5
    max_delay_seconds: 45
    jitter_seconds: 0.5
    per_host_concurrency: 1
    global_concurrency: 2
    max_retries: 3
    backoff_factor: 2.0
    respect_robots_txt: true
    adaptive: true
    cooldown_on_block_seconds: 900
    timeout_seconds: 35
    # SSRF: blokuj localhost / RFC1918 / metadata
    block_private_networks: true
    resolve_dns_for_ssrf: true
    max_redirects: 3
    max_response_bytes: 15000000
    allowed_hosts: []
  security:
    enabled: true
    block_private_networks: true
    allow_write_tools: true
    allow_notion_tools: true
    allow_r2_tools: true
    # strict_tool_mode: true  # tylko SAFE+FETCH tools
    strict_tool_mode: false
    redact_traces: true
    trace_tool_result_max_chars: 4000
    fleet_allowlist_only: true
    enforce_r2_prefix: true
    allowed_hosts: []
  governance:
    enabled: true
    mode: enforce   # enforce | monitor
    policy_pack: config/governance/tiz.policy.yaml
    audit_dir: data/governance
    fail_closed: false
    deny_require_approval: true
  fleet:
    # central = ten serwer GPU uczy skills/rules i publikuje knowledge dla VPS
    role: central
    sync_dir: data/fleet
    publish_known_firms: true
    publish_relations: true
    publish_ontology: true
    publish_firm_profiles: true
    publish_pricelists: true
    publish_literature: true
    publish_product_tech: true
schedule:
  every_hours: 6
