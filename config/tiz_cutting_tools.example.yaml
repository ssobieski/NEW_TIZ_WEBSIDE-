# Profil TIZ — narzędzia skrawające / machining
# Fokus: info techniczne produktów (cutting data / handbook / ISO 13399),
#        social (YouTube/LinkedIn/X), cenniki, e-catalog, PDF, publikacje, digital catalogue, e-shop,
#        targi branżowe, czasopisma, portale WWW
# Lista znanych firm = Notion „Katalogi konkurencji — indeks”
# cp config/tiz_cutting_tools.example.yaml config/industry.yaml

