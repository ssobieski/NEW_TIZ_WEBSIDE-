  notion:
    enabled: true
    token_env: NOTION_TOKEN
    root_pages:
    - 3c2bdd41-cccd-8176-bf12-f6efd37baacc
    - 3c2bdd41-cccd-81dc-8c62-e9aa3ff740aa
    - 3c2bdd41-cccd-816f-8171-c28e1128cf1c
    - 3c2bdd41-cccd-8152-9e94-d21ca8f3e95b
    - 308dfae4-647b-40e7-84a3-0b3f8406c769
    search_queries:
    - katalogi konkurencji
    - ecatalog PDF eshop
    - znane firmy indeks
    - ISO 13399
    - handbook machining
    max_pages: 100
    include_child_pages: true
    known_firms_database: 308dfae4-647b-40e7-84a3-0b3f8406c769
  cloudflare_r2:
    enabled: false
    account_id_env: CF_ACCOUNT_ID
    access_key_env: CF_R2_ACCESS_KEY_ID
    secret_key_env: CF_R2_SECRET_ACCESS_KEY
    bucket: tiz-market-intel
    prefix: monitoring/
    max_objects: 200
    text_extensions:
    - .json
    - .jsonl
    - .md
    - .txt
    - .html
    - .csv
    - .xml
    - .pdf
  firm_discovery:
    enabled: true
    language: en
    region: US
    max_items: 20
    search_queries:
    - '"cutting tools" (startup OR "new manufacturer" OR "new brand" OR debut OR "spin-off")'
    - '"carbide tools" ("enters the market" OR "new company" OR exhibitor OR "first catalog")'
    - '"tooling manufacturer" (launch OR unveils OR introduces) (catalog OR ecatalog)'
    - '"narzędzia skrawające" (nowy producent OR debiut OR "nowa marka")'
    - '"solid carbide" ("new brand" OR startup OR "new player")'
    feed_urls: []
    known_match_threshold: 0.88
llm:
  provider: vllm
  base_url: http://127.0.0.1:8000
  model: Qwen/Qwen2.5-72B-Instruct-AWQ
  temperature: 0.1
  timeout_seconds: 300
  api_key: EMPTY
  max_tokens: 4096
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.9
  max_model_len: 32768
agents:
  max_items_per_source: 20
  lookback_hours: 168
  report_dir: reports
  data_dir: data
  min_relevance_score: 0.25
  agentic:
    enabled: true
    max_steps: 14
    max_deep_parses: 10
    parallel_fetches: 6
    require_tool_use: true
    trace_dir: data/agent_traces
schedule:
  every_hours: 6
